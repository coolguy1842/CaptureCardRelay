name: Publish Web
on:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.repository == 'coolguy1842/CaptureCardRelay'
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install CMake and Make
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 'latest'
          actions-cache-folder: 'emsdk-cache'

      - name: Configure project
        run: emcmake cmake -S . -B build --preset "emscripten"

      - name: Run build
        run: cmake --build build -- -j 12

      - name: Install output
        run: cmake --install build --prefix public

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/bin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4