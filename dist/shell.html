<!DOCTYPE html>
<html>
	<head>
		<style>
			html, body, canvas {
				background-color: #000000;

				padding: 0;
				margin: 0;

				width: 100%;
				height: 100%;

				overflow: hidden;
			}

			#buttonContainer {
				background-color: #242424;

				width: 100%;
				height: 100%;

				display: flex;

				align-items: center;
				justify-content: center;
			}
		</style>
	</head>
	<body>
		<template id="script-template">
			{{{ SCRIPT }}}
		</template>

		<canvas style="display: none;" id="canvas"></canvas>
		<div id="buttonContainer">
			<button id="runButton" onclick="clickToRun();">Click to run</button>
		</div>

		<script>
			var Module = {
				canvas: (function() {
					const canvas = document.getElementById('canvas');
					return canvas;
				})(),
			};

			function clickToRun() {
				const buttonContainer = document.getElementById("buttonContainer");
				buttonContainer.remove();

				Module.canvas.style.display = "block";

  				const template = document.querySelector("#script-template");
  				const clone = template.content.cloneNode(true);

				document.body.appendChild(clone);
			}

			alert("This is a demo for the program. Audio (very bad), and video have limited quality on browsers. Expect worse quality, press O or Escape for options. Additionally WebGPU is not supported, frame rates will be very low.");
		</script>
	</body>
</html>
